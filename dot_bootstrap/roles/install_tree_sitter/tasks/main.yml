---
- name: Check if tree-sitter is installed
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.local/bin/tree-sitter"
  register: tree_sitter_installed

- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.local/bin"
    state: directory
    mode: '0755'
  when: not tree_sitter_installed.stat.exists

- name: Get latest tree-sitter release
  ansible.builtin.uri:
    url: https://api.github.com/repos/tree-sitter/tree-sitter/releases/latest
    return_content: true
  register: tree_sitter_release
  when: not tree_sitter_installed.stat.exists

- name: Set tree-sitter version fact
  ansible.builtin.set_fact:
    tree_sitter_version: "{{ tree_sitter_release.json.tag_name | regex_replace('^v', '') }}"
  when: not tree_sitter_installed.stat.exists

- name: install_tree_sitter | Create temp download directory
  ansible.builtin.tempfile:
    state: directory
    suffix: install_tree_sitter
  register: tree_sitter_tempdir
  when: not tree_sitter_installed.stat.exists

# The release asset is a gzipped single binary, not a tarball, so unarchive can't handle it.
- name: install_tree_sitter | Download tree-sitter binary
  ansible.builtin.get_url:
    url: "https://github.com/tree-sitter/tree-sitter/releases/download/v{{ tree_sitter_version }}/tree-sitter-linux-{{ 'x64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}.gz"
    dest: "{{ tree_sitter_tempdir.path }}/tree-sitter.gz"
    mode: '0644'
  when: not tree_sitter_installed.stat.exists

- name: install_tree_sitter | Decompress tree-sitter binary
  ansible.builtin.command:
    cmd: gunzip "{{ tree_sitter_tempdir.path }}/tree-sitter.gz"
    creates: "{{ tree_sitter_tempdir.path }}/tree-sitter"
  when: not tree_sitter_installed.stat.exists

- name: install_tree_sitter | Install tree-sitter binary
  ansible.builtin.copy:
    src: "{{ tree_sitter_tempdir.path }}/tree-sitter"
    dest: "{{ lookup('env', 'HOME') }}/.local/bin/tree-sitter"
    remote_src: true
    mode: '0755'
  when: not tree_sitter_installed.stat.exists

- name: install_tree_sitter | Remove temp download directory
  ansible.builtin.file:
    path: "{{ tree_sitter_tempdir.path }}"
    state: absent
  when: not tree_sitter_installed.stat.exists and tree_sitter_tempdir.path is defined
