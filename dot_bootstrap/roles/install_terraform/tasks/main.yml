---
- name: install_terraform | Configure HashiCorp Package Repo (RHEL)
  when: ansible_facts['distribution'] == 'RedHat'
  become: true
  block:
    - name: install_terraform | Import HashiCorp GPG key (RHEL)
      ansible.builtin.rpm_key:
        key: https://rpm.releases.hashicorp.com/gpg
        state: present

    - name: install_terraform | Add HashiCorp repository (RHEL)
      ansible.builtin.yum_repository:
        name: hashicorp
        description: HashiCorp Stable - $basearch
        baseurl: https://rpm.releases.hashicorp.com/RHEL/$releasever/$basearch/stable
        enabled: true
        gpgcheck: true
        gpgkey: https://rpm.releases.hashicorp.com/gpg

- name: install_terraform | Configure HashiCorp Package Repo (Rocky/CentOS)
  when: ansible_facts['distribution'] in ['Rocky', 'CentOS']
  become: true
  block:
    - name: install_terraform | Import HashiCorp GPG key (Rocky/CentOS)
      ansible.builtin.rpm_key:
        key: https://rpm.releases.hashicorp.com/gpg
        state: present

    - name: install_terraform | Add HashiCorp repository (Rocky/CentOS)
      ansible.builtin.yum_repository:
        name: hashicorp
        description: HashiCorp Stable - $basearch
        baseurl: https://rpm.releases.hashicorp.com/RHEL/$releasever/$basearch/stable
        enabled: true
        gpgcheck: true
        gpgkey: https://rpm.releases.hashicorp.com/gpg

- name: install_terraform | Configure HashiCorp Package Repo (Fedora)
  when: ansible_facts['distribution'] == 'Fedora'
  become: true
  block:
    - name: install_terraform | Import HashiCorp GPG key (Fedora)
      ansible.builtin.rpm_key:
        key: https://rpm.releases.hashicorp.com/gpg
        state: present

    - name: install_terraform | Add HashiCorp repository (Fedora)
      ansible.builtin.yum_repository:
        name: hashicorp
        description: HashiCorp Stable - $basearch
        baseurl: https://rpm.releases.hashicorp.com/fedora/$releasever/$basearch/stable
        enabled: true
        gpgcheck: true
        gpgkey: https://rpm.releases.hashicorp.com/gpg

- name: install_terraform | Configure HashiCorp Package Repo (Debian/Ubuntu)
  when: ansible_facts['os_family'] == "Debian"
  become: true
  block:
    - name: install_terraform | Install Debian prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: true

    - name: install_terraform | Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: install_terraform | Download HashiCorp GPG key
      ansible.builtin.get_url:
        url: https://apt.releases.hashicorp.com/gpg
        dest: /etc/apt/keyrings/hashicorp.asc
        mode: '0644'

    - name: install_terraform | Add HashiCorp repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }} signed-by=/etc/apt/keyrings/hashicorp.asc]
          https://apt.releases.hashicorp.com
          {{ ansible_facts['distribution_release'] }} main
        state: present
        filename: hashicorp

- name: install_terraform | Install Terraform
  become: true
  ansible.builtin.package:
    name: terraform
    state: present
